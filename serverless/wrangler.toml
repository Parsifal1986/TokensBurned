name = "tokensburned-api"
main = "src/index.js"
compatibility_date = "2026-08-30"
workers_dev = true

[[routes]]
pattern = "api.tokensburned.com"
custom_domain = true

[vars]
APP_ORIGIN = "https://tokensburned.com"
API_ORIGIN = "https://api.tokensburned.com"
CARD_ORIGIN = "https://api.tokensburned.com/v1/cards"
GITHUB_CLIENT_ID = "Iv23liAuvAy5CLQVmpgd"

[[d1_databases]]
binding = "DB"
database_name = "tokensburned"
database_id = "61bed05d-ca2d-4b9a-8998-f6b242c7a86c"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CARDS"
bucket_name = "tokensburned-cards"
